services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mood}
      POSTGRES_USER: ${POSTGRES_USER:-mood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mood_local_only}
    ports:
      - '127.0.0.1:${MOOD_POSTGRES_PORT:-5432}:5432'
    volumes:
      - mood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: ['python', '-m', 'app.db.migrate']
    environment:
      MOOD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mood}:${POSTGRES_PASSWORD:-mood_local_only}@db:5432/${POSTGRES_DB:-mood}
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      MOOD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mood}:${POSTGRES_PASSWORD:-mood_local_only}@db:5432/${POSTGRES_DB:-mood}
      MOOD_AI_SERVICE_TOKEN: ${MOOD_AI_SERVICE_TOKEN:-}
      MOOD_AI_CONTROL_TOKEN: ${MOOD_AI_CONTROL_TOKEN:-}
      MOOD_AI_BASE_URL: http://ai:8001
      MOOD_CORS_ORIGINS: ${MOOD_CORS_ORIGINS:-["http://127.0.0.1:5173","http://127.0.0.1:5174"]}
      MOOD_USER_SESSION_TTL_SECONDS: ${MOOD_USER_SESSION_TTL_SECONDS:-28800}
      MOOD_WS_TICKET_TTL_SECONDS: ${MOOD_WS_TICKET_TTL_SECONDS:-30}
      MOOD_REALTIME_POLL_SECONDS: ${MOOD_REALTIME_POLL_SECONDS:-1}
      MOOD_AI_MIN_CONFIDENCE: ${MOOD_AI_MIN_CONFIDENCE:-0.5}
      MOOD_ALLOW_SIMULATED_AI: ${MOOD_ALLOW_SIMULATED_AI:-false}
    ports:
      - '127.0.0.1:${MOOD_BACKEND_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  ai:
    build:
      context: .
      dockerfile: infra/ai.Dockerfile
    environment:
      AI_BACKEND_URL: http://backend:8000
      AI_SERVICE_TOKEN: ${MOOD_AI_SERVICE_TOKEN:-}
      AI_CONTROL_TOKEN: ${MOOD_AI_CONTROL_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - mood_ai_data:/var/lib/mood-ai
    ports:
      - '127.0.0.1:${MOOD_AI_PORT:-8001}:8001'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
  admin:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        APP: admin
    ports:
      - '127.0.0.1:${MOOD_ADMIN_PORT:-5173}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        APP: client
        ADMIN_PUBLIC_URL: ${MOOD_ADMIN_PUBLIC_URL:-}
    ports:
      - '127.0.0.1:${MOOD_CLIENT_PORT:-5174}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mood_pgdata:
  mood_ai_data:
